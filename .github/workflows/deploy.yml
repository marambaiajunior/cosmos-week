name: Publicar site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Atualizar notícias"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages deve ter somente um deployment ativo por vez.
# Em vez de cancelar um deployment no meio (o que pode deixá-lo preso),
# enfileiramos publicações concorrentes e processamos uma por vez.
concurrency:
  group: github-pages
  queue: max

jobs:
  deploy:
    # workflow_run dispara mesmo quando o workflow anterior falha.
    # Só publicamos após uma atualização diária bem-sucedida.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout da versão mais recente da main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
