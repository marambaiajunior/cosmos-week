name: Atualizar notícias

on:
  schedule:
    # Atualiza 1× por dia, fora da madrugada em Utah.
    # GitHub Actions usa UTC e pode atrasar/descartar jobs em horários de pico,
    # especialmente no começo de cada hora. Por isso usamos um minuto quebrado (:37).
    # Horário em Utah (Mountain Time):
    #   15:37 UTC = 09:37 MDT (verão) / 08:37 MST (inverno)
    - cron: '37 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmos-week-feed
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      COSMOS_SITE_URL: 'https://www.cosmosweek.com/'
      GEMINI_BATCH_SIZE: '1'
      GEMINI_RPM_LIMIT: '3'
      GEMINI_RETRY_ON_429: '1'
      GEMINI_RETRY_TRANSIENT: '1'
      GEMINI_RETRY_BASE_DELAY: '25'
      GEMINI_RETRY_DELAY_429: '75'
      GEMINI_MAX_REVIEW_SECONDS: '900'
      GEMINI_DISABLE_AFTER_CONSECUTIVE_503: '2'
      GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS || 'gemini-3.5-flash-lite' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Corrigir aliases antigos da pasta do livro
        run: python scripts/normalize_book_paths.py

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validar o site antes de consultar serviços externos
        run: |
          python scripts/validate_site.py
          python scripts/validate_vortice.py
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_app_logic.mjs

      - name: Verificar chave Gemini
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning::GEMINI_API_KEY não configurada. A revisão do português será pulada."
            echo "Para ativar: Settings > Secrets and variables > Actions > New repository secret"
            echo "Nome: GEMINI_API_KEY  |  Valor: sua chave do Google AI Studio"
          else
            echo "✓ GEMINI_API_KEY presente (${#GEMINI_API_KEY} caracteres)"
          fi

      - name: Validar sintaxe do script
        run: python -m py_compile scripts/fetch_news.py

      - name: Gerar portal e metadados estáticos
        run: python scripts/fetch_news.py

      - name: Aplicar curadoria editorial do Cosmos Week
        run: python scripts/editorial_refine.py

      - name: Criar índice público otimizado
        run: node scripts/build_archive_index.mjs

      - name: Sincronizar a interface das páginas principais
        run: node scripts/upgrade_shell_pages.mjs

      - name: Atualizar o mapa do site
        run: node scripts/build_sitemap.mjs

      - name: Validar arquivos gerados
        run: python scripts/validate_site.py

      - name: Validar Vórtice Maligno, SEO e consentimento
        run: |
          set -euo pipefail
          python scripts/validate_vortice.py
          node --check assets/js/cw-analytics.js
          node --check assets/js/book.js
          node --check assets/js/app.js
          node scripts/test_analytics_consent.mjs
          node scripts/test_app_logic.mjs

      - name: Mostrar alterações geradas
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git status --short

      - name: Commitar mudanças
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas notícias."
          else
            git commit -m "Atualização automática das notícias [skip ci]"
            git push
          fi
