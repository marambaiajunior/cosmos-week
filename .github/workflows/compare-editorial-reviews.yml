name: Comparar revisão editorial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS || 'gemini-3.5-flash-lite' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.2-sol' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Comparar os dois revisores
        run: python scripts/compare_editorial_reviews.py
      - name: Guardar relatório da comparação
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: comparacao-revisao-editorial
          path: comparacao-revisao.json
          retention-days: 3
