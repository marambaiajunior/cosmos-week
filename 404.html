<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>Página não encontrada | Cosmos Week</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f7faff; background: radial-gradient(circle at 50% 20%, #172f52, #07111f 55%); }
    main { width: min(680px, calc(100% - 36px)); padding: 48px 28px; text-align: center; }
    img { width: 58px; height: 58px; }
    .mark { display: flex; justify-content: center; margin-bottom: 28px; }
    .eyebrow { color: #67e8f9; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0 14px; font: 700 clamp(2.5rem, 9vw, 5rem)/.95 Georgia, serif; letter-spacing: -.05em; }
    p { max-width: 50ch; margin: 0 auto 28px; color: #afbed2; line-height: 1.7; }
    a { display: inline-flex; min-height: 46px; align-items: center; padding: 0 18px; color: #07111f; background: #fff; border-radius: 10px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #67e8f9; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/assets/favicon.svg" alt=""></div>
    <div class="eyebrow">Erro 404</div>
    <h1>Esta órbita não existe.</h1>
    <p>A página pode ter mudado de endereço ou não estar mais disponível. Volte à capa para continuar explorando as notícias científicas.</p>
    <a href="/">Voltar ao Cosmos Week</a>
  </main>
</body>
</html>
